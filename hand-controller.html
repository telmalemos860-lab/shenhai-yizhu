<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深海遗珠 · 手势控制器</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060d1a;color:#e8f4fc;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem}

/* Camera preview */
.cam-wrap{position:relative;width:100%;max-width:360px;border-radius:16px;overflow:hidden;border:2px solid rgba(74,159,212,.3);background:#000;aspect-ratio:4/3}
#cam-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#cam-canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}

/* Gesture display */
.gesture-box{text-align:center}
.gesture-icon{font-size:3.5rem;margin-bottom:.5rem;min-height:4rem;display:flex;align-items:center;justify-content:center}
.gesture-name{font-size:1rem;letter-spacing:.15em;color:rgba(168,216,240,.8);margin-bottom:.3rem}
.gesture-hint{font-size:.75rem;color:rgba(168,216,240,.4);letter-spacing:.1em}

/* Status */
.status-row{display:flex;align-items:center;gap:.6rem;font-size:.75rem;letter-spacing:.15em}
.status-dot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0;transition:background .3s}
.status-dot.connected{background:#4a9fd4;animation:pulse 1.5s ease-in-out infinite}
.status-dot.error{background:#f5c2cc}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
#status-text{color:rgba(168,216,240,.6)}

/* Gesture guide */
.guide{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%;max-width:360px}
.guide-item{background:rgba(10,31,62,.5);border:1px solid rgba(74,159,212,.15);border-radius:10px;padding:.7rem;text-align:center}
.guide-item .icon{font-size:1.4rem;margin-bottom:.3rem}
.guide-item .label{font-size:.62rem;letter-spacing:.1em;color:rgba(168,216,240,.6)}
.guide-item .effect{font-size:.65rem;color:rgba(245,194,204,.7);margin-top:.15rem}

/* Start button */
#start-btn{background:rgba(74,159,212,.15);border:2px solid rgba(74,159,212,.4);color:#a8d8f0;padding:.9rem 2.5rem;border-radius:30px;font-size:.9rem;letter-spacing:.2em;cursor:pointer;transition:all .3s;width:100%;max-width:360px}
#start-btn:active{background:rgba(74,159,212,.3)}
#start-btn.hide{display:none}

.title{font-size:1.1rem;letter-spacing:.2em;color:rgba(168,216,240,.8);text-align:center}
.subtitle{font-size:.7rem;letter-spacing:.15em;color:rgba(168,216,240,.35);text-align:center;margin-top:-.8rem}
</style>
</head>
<body>

<p class="title">深海遗珠 · 手势控制</p>
<p class="subtitle">DEEPSEA LIVING GESTURE CONTROLLER</p>

<!-- Status -->
<div class="status-row">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">等待连接电脑...</span>
</div>

<!-- Camera -->
<div class="cam-wrap" id="cam-wrap" style="display:none">
  <video id="cam-video" playsinline></video>
  <canvas id="cam-canvas"></canvas>
</div>

<!-- Gesture display -->
<div class="gesture-box" id="gesture-box" style="display:none">
  <div class="gesture-icon" id="gesture-icon">—</div>
  <div class="gesture-name" id="gesture-name">将手放入画面</div>
  <div class="gesture-hint">手势将实时控制电脑端粒子效果</div>
</div>

<!-- Start button -->
<button id="start-btn">开启摄像头</button>

<!-- Gesture guide -->
<div class="guide">
  <div class="guide-item"><div class="icon">✋</div><div class="label">张开手掌</div><div class="effect">粒子扩散</div></div>
  <div class="guide-item"><div class="icon">✊</div><div class="label">握拳</div><div class="effect">粒子爆炸</div></div>
  <div class="guide-item"><div class="icon">☝️</div><div class="label">单指指向</div><div class="effect">粒子聚集</div></div>
  <div class="guide-item"><div class="icon">✌️</div><div class="label">比耶</div><div class="effect">粒子平静</div></div>
</div>

<script>
// ── WebSocket 连接电脑服务器 ──
// 自动使用当前页面的 host（手机访问的就是服务器IP）
const WS_URL = `ws://${location.hostname}:8888`;
let ws = null;
let wsReady = false;

const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'phone' }));
    wsReady = true;
    statusDot.className  = 'status-dot connected';
    statusText.textContent = '已连接电脑 ✓';
    console.log('WS connected');
  };

  ws.onclose = () => {
    wsReady = false;
    statusDot.className  = 'status-dot error';
    statusText.textContent = '连接断开，3秒后重试...';
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    statusDot.className  = 'status-dot error';
    statusText.textContent = '连接失败，请确认电脑服务器已启动';
  };
}
connectWS();

// ── Gesture classifier ──
function classifyGesture(lm) {
  const wrist = lm[0];
  function ext(tip, pip) {
    return Math.hypot(lm[tip].x-wrist.x,lm[tip].y-wrist.y) >
           Math.hypot(lm[pip].x-wrist.x,lm[pip].y-wrist.y);
  }
  const f = [ext(4,3),ext(8,6),ext(12,10),ext(16,14),ext(20,18)];
  const n = f.filter(Boolean).length;
  if(n>=4)               return 'open';
  if(n===0)              return 'fist';
  if(n===1&&f[1])        return 'point';
  if(n===2&&f[1]&&f[2])  return 'peace';
  return 'none';
}

const GESTURE_INFO = {
  open:  { icon:'✋', name:'张开手掌 · 粒子扩散', scatter:1.0, burst:0   },
  fist:  { icon:'✊', name:'握拳 · 粒子爆炸',     scatter:0,   burst:1.0 },
  point: { icon:'☝️', name:'指向 · 粒子聚集',     scatter:-.3, burst:0   },
  peace: { icon:'✌️', name:'比耶 · 粒子平静',     scatter:.2,  burst:0   },
  none:  { icon:'🖐',  name:'将手放入画面',         scatter:0,   burst:0   },
};

// ── Draw skeleton on canvas ──
const camCanvas = document.getElementById('cam-canvas');
const ctx       = camCanvas.getContext('2d');
function drawSkeleton(lm) {
  const W = camCanvas.width, H = camCanvas.height;
  const conn = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]];
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(74,159,212,.65)'; ctx.lineWidth=1.5;
  conn.forEach(([a,b])=>{
    ctx.beginPath();
    ctx.moveTo(lm[a].x*W,lm[a].y*H);
    ctx.lineTo(lm[b].x*W,lm[b].y*H);
    ctx.stroke();
  });
  lm.forEach((p,i)=>{
    ctx.beginPath();
    ctx.arc(p.x*W,p.y*H,i===0?4:2.5,0,Math.PI*2);
    ctx.fillStyle=i===0?'rgba(245,194,204,.9)':'rgba(168,216,240,.85)';
    ctx.fill();
  });
}

// ── MediaPipe Hands ──
const video  = document.getElementById('cam-video');
const gestureIcon = document.getElementById('gesture-icon');
const gestureName = document.getElementById('gesture-name');
let lastGesture = '';

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  camCanvas.width  = video.videoWidth;
  camCanvas.height = video.videoHeight;

  if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm   = results.multiHandLandmarks[0];
    const palm = lm[9];
    drawSkeleton(lm);

    const g  = classifyGesture(lm);
    const gi = GESTURE_INFO[g] || GESTURE_INFO.none;

    // Update UI
    if(g !== lastGesture) {
      lastGesture = g;
      gestureIcon.textContent = gi.icon;
      gestureName.textContent = gi.name;
    }

    // Send to desktop
    if(wsReady && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type:    'hand',
        x:       -(palm.x - 0.5) * 2,  // -1..1, mirrored
        y:       -(palm.y - 0.5) * 2,
        screenX: (1 - palm.x),          // 0..1 for dot position
        screenY: palm.y,
        burst:   gi.burst,
        scatter: gi.scatter,
        gesture: g
      }));
    }
  } else {
    ctx.clearRect(0,0,camCanvas.width,camCanvas.height);
    lastGesture = '';
    gestureIcon.textContent = '—';
    gestureName.textContent = '将手放入画面';
    if(wsReady && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'no_hand' }));
    }
  }
});

// ── Start camera on button tap ──
document.getElementById('start-btn').addEventListener('click', async () => {
  document.getElementById('start-btn').classList.add('hide');
  document.getElementById('cam-wrap').style.display  = 'block';
  document.getElementById('gesture-box').style.display = 'block';

  const mpCamera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640, height: 480
  });
  await mpCamera.start();
  statusText.textContent = wsReady ? '已连接电脑 ✓' : '摄像头已开启，等待连接...';
});
</script>
</body>
</html>
